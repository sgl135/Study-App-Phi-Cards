<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Phi Study - Quizlet Alternative</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Custom Color Themes */
    :root {
      --color-wine: #6B1D2F;
      --color-wine-dark: #501422;
      --color-silver-blue: #8A9EA7;
      --color-silver-light: #EAF0F3;
    }

    /* 3D Flip Card Effect */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { transform: rotateY(180deg); }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Initial Demo Deck
    const DEFAULT_DECK = [
      { id: 1, term: "Founding Date", definition: "April 28, 1867 at Monmouth College" },
      { id: 2, term: "Official Colors", definition: "Wine and Silver Blue" },
      { id: 3, term: "Official Flower", definition: "Wine Carnation" },
      { id: 4, term: "Symbol", definition: "Arrow" },
      { id: 5, term: "Philanthropy", definition: "Read > Lead > Achieve" }
    ];

    function App() {
      const [cards, setCards] = useState(() => {
        const saved = localStorage.getItem('piphi_flashcards');
        return saved ? JSON.parse(saved) : DEFAULT_DECK;
      });

      const [activeMode, setActiveMode] = useState('flashcards'); // flashcards, learn, match, create
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);

      // Save cards to LocalStorage whenever they change
      useEffect(() => {
        localStorage.setItem('piphi_flashcards', JSON.stringify(cards));
      }, [cards]);

      // Handle card deck management
      const handleAddCard = (term, definition) => {
        const newCard = { id: Date.now(), term, definition };
        setCards([...cards, newCard]);
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Header */}
          <header class="bg-[#6B1D2F] text-white shadow-md p-4 sticky top-0 z-50">
            <div class="max-w-5xl mx-auto flex justify-between items-center">
              <div class="flex items-center gap-2">
                <span class="text-2xl">🏹</span>
                <h1 class="text-2xl font-bold tracking-tight">PiPhi<span class="text-[#8A9EA7] font-light">Study</span></h1>
              </div>
              <div class="flex gap-2">
                {['flashcards', 'learn', 'match', 'create'].map((mode) => (
                  <button
                    key={mode}
                    onClick={() => { setActiveMode(mode); setIsFlipped(false); setCurrentIndex(0); }}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold capitalize transition ${
                      activeMode === mode 
                        ? 'bg-[#8A9EA7] text-white shadow' 
                        : 'hover:bg-[#501422] text-slate-100'
                    }`}
                  >
                    {mode}
                  </button>
                ))}
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col justify-center">
            {cards.length === 0 ? (
              <div class="text-center py-12">
                <p class="text-xl text-gray-600 mb-4">No flashcards found. Create a set to get started!</p>
                <button onClick={() => setActiveMode('create')} class="px-6 py-2 bg-[#6B1D2F] text-white rounded-lg font-semibold">Create Cards</button>
              </div>
            ) : (
              <>
                {activeMode === 'flashcards' && (
                  <FlashcardMode 
                    cards={cards} 
                    currentIndex={currentIndex} 
                    setCurrentIndex={setCurrentIndex}
                    isFlipped={isFlipped}
                    setIsFlipped={setIsFlipped}
                  />
                )}
                {activeMode === 'learn' && <LearnMode cards={cards} />}
                {activeMode === 'match' && <MatchMode cards={cards} />}
                {activeMode === 'create' && <CreateMode cards={cards} setCards={setCards} onAdd={handleAddCard} />}
              </>
            )}
          </main>
        </div>
      );
    }

    /* --- FLASHCARD MODE --- */
    function FlashcardMode({ cards, currentIndex, setCurrentIndex, isFlipped, setIsFlipped }) {
      const card = cards[currentIndex];

      const nextCard = () => {
        setIsFlipped(false);
        setCurrentIndex((prev) => (prev + 1) % cards.length);
      };

      const prevCard = () => {
        setIsFlipped(false);
        setCurrentIndex((prev) => (prev - 1 + cards.length) % cards.length);
      };

      return (
        <div class="flex flex-col items-center">
          <div class="w-full text-right mb-2 text-sm text-[#8A9EA7] font-semibold">
            Card {currentIndex + 1} of {cards.length}
          </div>

          {/* Flip Container */}
          <div 
            onClick={() => setIsFlipped(!isFlipped)} 
            class="w-full h-80 cursor-pointer perspective-1000 select-none"
          >
            <div class={`relative w-full h-full duration-500 transform-style-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
              
              {/* Front (Term) */}
              <div class="absolute w-full h-full bg-white border-2 border-[#8A9EA7] rounded-2xl shadow-xl flex flex-col justify-center items-center p-8 backface-hidden">
                <span class="text-xs font-bold text-[#8A9EA7] uppercase tracking-wider mb-2">TERM</span>
                <p class="text-3xl font-semibold text-center text-slate-800">{card?.term}</p>
                <span class="absolute bottom-4 text-xs text-slate-400">Click to flip 🔄</span>
              </div>

              {/* Back (Definition) */}
              <div class="absolute w-full h-full bg-[#6B1D2F] text-white border-2 border-[#6B1D2F] rounded-2xl shadow-xl flex flex-col justify-center items-center p-8 backface-hidden rotate-y-180">
                <span class="text-xs font-bold text-[#8A9EA7] uppercase tracking-wider mb-2">DEFINITION</span>
                <p class="text-2xl font-medium text-center">{card?.definition}</p>
              </div>

            </div>
          </div>

          {/* Controls */}
          <div class="flex items-center gap-6 mt-8">
            <button onClick={prevCard} class="p-3 bg-white border border-[#8A9EA7] text-[#6B1D2F] rounded-full hover:bg-slate-100 shadow transition">
              👈 Prev
            </button>
            <button onClick={() => setIsFlipped(!isFlipped)} class="px-6 py-2 bg-[#8A9EA7] text-white font-semibold rounded-lg shadow hover:bg-opacity-90">
              Flip Card
            </button>
            <button onClick={nextCard} class="p-3 bg-white border border-[#8A9EA7] text-[#6B1D2F] rounded-full hover:bg-slate-100 shadow transition">
              Next 👉
            </button>
          </div>
        </div>
      );
    }

    /* --- LEARN MODE --- */
    function LearnMode({ cards }) {
      const [qIndex, setQIndex] = useState(0);
      const [selected, setSelected] = useState(null);
      const [score, setScore] = useState(0);
      const [options, setOptions] = useState([]);

      const currentCard = cards[qIndex];

      // Generate Multiple Choice Options
      useEffect(() => {
        if (!currentCard) return;
        const choices = [currentCard.definition];
        const otherCards = cards.filter(c => c.id !== currentCard.id);
        const shuffledOthers = [...otherCards].sort(() => 0.5 - Math.random());
        
        for (let i = 0; i < Math.min(3, shuffledOthers.length); i++) {
          choices.push(shuffledOthers[i].definition);
        }
        setOptions(choices.sort(() => 0.5 - Math.random()));
        setSelected(null);
      }, [qIndex, cards]);

      const handleSelect = (choice) => {
        if (selected) return;
        setSelected(choice);
        if (choice === currentCard.definition) setScore(score + 1);
      };

      const handleNext = () => {
        setQIndex((prev) => (prev + 1) % cards.length);
      };

      return (
        <div class="bg-white p-8 rounded-2xl border border-[#8A9EA7] shadow-lg">
          <div class="flex justify-between items-center mb-6">
            <span class="text-[#8A9EA7] font-semibold text-sm">Question {qIndex + 1} of {cards.length}</span>
            <span class="text-sm font-bold bg-[#EAF0F3] text-[#6B1D2F] px-3 py-1 rounded-full">Score: {score}</span>
          </div>

          <h3 class="text-xl font-bold text-slate-800 mb-6">{currentCard?.term}</h3>

          <div class="space-y-3">
            {options.map((opt, idx) => {
              let btnStyle = "bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100";
              if (selected) {
                if (opt === currentCard.definition) btnStyle = "bg-emerald-100 border-emerald-500 text-emerald-800 font-bold";
                else if (opt === selected) btnStyle = "bg-rose-100 border-rose-500 text-rose-800";
              }

              return (
                <button
                  key={idx}
                  onClick={() => handleSelect(opt)}
                  class={`w-full text-left p-4 rounded-xl border transition flex justify-between items-center ${btnStyle}`}
                >
                  <span>{opt}</span>
                </button>
              );
            })}
          </div>

          {selected && (
            <button onClick={handleNext} class="mt-6 w-full py-3 bg-[#6B1D2F] text-white font-semibold rounded-xl shadow hover:bg-[#501422]">
              Next Question 👉
            </button>
          )}
        </div>
      );
    }

    /* --- MATCH GAME MODE --- */
    function MatchMode({ cards }) {
      const [items, setItems] = useState([]);
      const [selected, setSelected] = useState([]);
      const [matched, setMatched] = useState([]);
      const [timer, setTimer] = useState(0);
      const [isGameActive, setIsGameActive] = useState(false);

      const startGame = () => {
        // Take up to 6 cards for matching game
        const sampleCards = [...cards].sort(() => 0.5 - Math.random()).slice(0, 6);
        const gameItems = [];
        
        sampleCards.forEach(c => {
          gameItems.push({ id: c.id + '-term', cardId: c.id, text: c.term, type: 'term' });
          gameItems.push({ id: c.id + '-def', cardId: c.id, text: c.definition, type: 'def' });
        });

        setItems(gameItems.sort(() => 0.5 - Math.random()));
        setSelected([]);
        setMatched([]);
        setTimer(0);
        setIsGameActive(true);
      };

      useEffect(() => {
        let interval;
        if (isGameActive && matched.length < items.length) {
          interval = setInterval(() => setTimer(t => t + 1), 1000);
        }
        return () => clearInterval(interval);
      }, [isGameActive, matched, items]);

      const handleTileClick = (item) => {
        if (selected.length === 2 || matched.includes(item.id)) return;

        const newSelected = [...selected, item];
        setSelected(newSelected);

        if (newSelected.length === 2) {
          if (newSelected[0].cardId === newSelected[1].cardId && newSelected[0].type !== newSelected[1].type) {
            setMatched([...matched, newSelected[0].id, newSelected[1].id]);
            setSelected([]);
          } else {
            setTimeout(() => setSelected([]), 800);
          }
        }
      };

      return (
        <div class="text-center">
          {!isGameActive ? (
            <div class="bg-white p-8 rounded-2xl border border-[#8A9EA7] shadow-lg">
              <h2 class="text-2xl font-bold text-[#6B1D2F] mb-2">Match Game ⏱️</h2>
              <p class="text-slate-600 mb-6">Match all the terms to their definitions as fast as you can!</p>
              <button onClick={startGame} class="px-8 py-3 bg-[#6B1D2F] text-white font-bold rounded-xl shadow hover:bg-[#501422]">
                Start Game
              </button>
            </div>
          ) : (
            <div>
              <div class="flex justify-between items-center mb-4">
                <span class="text-lg font-bold text-[#6B1D2F]">Time: {timer}s</span>
                <button onClick={startGame} class="text-sm text-[#8A9EA7] underline font-semibold">Restart</button>
              </div>

              {matched.length === items.length ? (
                <div class="bg-white p-8 rounded-2xl border border-emerald-500 shadow-xl">
                  <h2 class="text-3xl font-extrabold text-emerald-600 mb-2">🎉 Fantastic!</h2>
                  <p class="text-slate-700 text-lg mb-4">You cleared the board in <span class="font-bold">{timer} seconds</span>.</p>
                  <button onClick={startGame} class="px-6 py-2 bg-[#6B1D2F] text-white font-semibold rounded-lg">Play Again</button>
                </div>
              ) : (
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                  {items.map(item => {
                    const isSel = selected.some(s => s.id === item.id);
                    const isMatch = matched.includes(item.id);

                    if (isMatch) return <div key={item.id} class="h-28 opacity-0 transition duration-300"></div>;

                    return (
                      <button
                        key={item.id}
                        onClick={() => handleTileClick(item)}
                        class={`h-28 p-4 rounded-xl border text-sm font-semibold flex items-center justify-center transition shadow-sm ${
                          isSel 
                            ? 'bg-[#8A9EA7] text-white border-[#8A9EA7] scale-105' 
                            : 'bg-white border-slate-200 text-slate-800 hover:border-[#8A9EA7]'
                        }`}
                      >
                        {item.text}
                      </button>
                    );
                  })}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    /* --- CREATE & EDIT MODE --- */
    function CreateMode({ cards, setCards, onAdd }) {
      const [term, setTerm] = useState('');
      const [definition, setDefinition] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!term.trim() || !definition.trim()) return;
        onAdd(term, definition);
        setTerm('');
        setDefinition('');
      };

      const handleDelete = (id) => {
        setCards(cards.filter(c => c.id !== id));
      };

      return (
        <div class="space-y-6">
          {/* Add New Form */}
          <form onSubmit={handleSubmit} class="bg-white p-6 rounded-2xl border border-[#8A9EA7] shadow-md">
            <h3 class="text-lg font-bold text-[#6B1D2F] mb-4">Add New Card</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
              <input
                type="text"
                placeholder="Enter Term"
                value={term}
                onChange={(e) => setTerm(e.target.value)}
                class="p-3 border border-slate-300 rounded-lg focus:outline-none focus:border-[#6B1D2F]"
              />
              <input
                type="text"
                placeholder="Enter Definition"
                value={definition}
                onChange={(e) => setDefinition(e.target.value)}
                class="p-3 border border-slate-300 rounded-lg focus:outline-none focus:border-[#6B1D2F]"
              />
            </div>
            <button type="submit" class="w-full py-3 bg-[#6B1D2F] text-white font-bold rounded-lg shadow hover:bg-[#501422]">
              + Add Card
            </button>
          </form>

          {/* List Existing Cards */}
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-md">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Current Deck ({cards.length})</h3>
            <div class="divide-y divide-slate-100 max-h-80 overflow-y-auto">
              {cards.map((c) => (
                <div key={c.id} class="py-3 flex justify-between items-center text-sm">
                  <div class="grid grid-cols-2 gap-4 flex-1 pr-4">
                    <span class="font-bold text-slate-800">{c.term}</span>
                    <span class="text-slate-600">{c.definition}</span>
                  </div>
                  <button onClick={() => handleDelete(c.id)} class="text-rose-500 hover:text-rose-700 font-bold px-2">
                    🗑️
                  </button>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
